<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабинет мастера</title>
<style>
:root{--bg:#faf5f7;--card:#fff;--ink:#2a1626;--mut:#7d6677;--line:#eadde4;--acc:#9b2d6f;--onacc:#fff;--ok:#1f7a5c;--bad:#b3362f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f18;--card:#26172e;--ink:#f6eaf2;--mut:#b99fb0;--line:#3a2736;--acc:#e07bb8;--onacc:#2a0f20;--ok:#5fd0a5;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:16px 16px 96px}
h1{font-size:24px;font-weight:800;margin:4px 0 10px;letter-spacing:-.02em}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:15px system-ui,-apple-system,Roboto,sans-serif}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.day{flex:none;width:52px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 0;font:600 12px system-ui,-apple-system,Roboto,sans-serif;text-align:center}
.day b{display:block;font-size:17px}.day.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.day i{display:block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin:3px auto 0}.day.on i{background:var(--onacc)}.day:not(.has) i{visibility:hidden}
.vt{display:flex;border:1px solid var(--acc);border-radius:12px;overflow:hidden;margin-bottom:10px}.vt button{flex:1;border:0;background:none;color:var(--acc);font:700 12px system-ui,-apple-system,Roboto,sans-serif;padding:10px 2px}.vt button.on{background:var(--acc);color:var(--onacc)}
.gh{display:flex;padding-left:34px;gap:1px}.gd{flex:1;border:0;background:none;color:var(--mut);font:600 12px system-ui,-apple-system,Roboto,sans-serif;padding:4px 0;text-align:center}.gd b{display:block;font-size:14px;color:var(--ink)}.gd.td b{color:var(--acc)}
.gt span.h{color:var(--ink);font-weight:700;font-size:12px}.gb{margin-top:8px;display:flex;position:relative;border-top:1px solid var(--line)}.gt{width:34px;flex:none;position:relative}.gt span{position:absolute;right:4px;font-size:11px;color:var(--mut);transform:translateY(-50%)}
.gc{flex:1;position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(rgba(128,128,128,.16) 1px,transparent 1px);background-size:100% 72px,100% 72px;background-position:0 0,0 36px;min-width:0}
.gk{position:absolute;left:1px;right:1px;border:0;border-radius:6px;padding:3px;overflow:hidden;text-align:left;font:inherit;color:#1c1030;background:#cdb8ff;line-height:1.15}.gk b{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis}.gk small{display:block;font-size:9px;opacity:.7;word-break:break-word}
.gk.done{background:#6fdca8}.gk.br{background:#4a7fb5;color:#fff}.dayh{font-weight:800;margin:14px 0 6px}
.card.cb{display:block;width:100%;text-align:left;color:var(--ink);font:inherit}.ap.cancel .mut{text-decoration:none}
@keyframes sl{from{opacity:.4;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes sr{from{opacity:.4;transform:translateX(-40px)}to{opacity:1;transform:none}}
#app.sl{animation:sl .22s ease-out}#app.sr{animation:sr .22s ease-out}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calh b{font-size:16px}.calh .btn{padding:8px 16px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}.cal .wd{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cd{position:relative;border:1px solid transparent;background:var(--card);color:var(--ink);border-radius:12px;height:44px;font:600 15px system-ui,-apple-system,Roboto,sans-serif;padding:0}
.cd.ot{opacity:.4}.cd.td{border-color:var(--acc)}.cd.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.cd i{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc);visibility:hidden}.cd.on i{background:var(--onacc)}.cd.has i{visibility:visible}
.calb{display:flex;gap:8px;margin-bottom:10px}.calb .btn{flex:1;padding:9px}
.sum{color:var(--mut);margin:0 0 10px}
.ap{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left;color:var(--ink);font:inherit}
.ap .t{flex:none;width:54px;font-weight:800}.ap .t small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ap.done{border-left:4px solid var(--ok)}.ap.cancel{opacity:.5;text-decoration:line-through}.ap.new{border-left:4px solid var(--acc)}
.btn{border:0;background:var(--acc);color:var(--onacc);font:700 14px system-ui,-apple-system,Roboto,sans-serif;padding:10px 16px;border-radius:12px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.bad{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.big{width:100%;padding:14px;font-size:16px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:3}
.tabs button{flex:1;max-width:140px;border:0;background:none;color:var(--mut);font:600 13px system-ui,-apple-system,Roboto,sans-serif;padding:10px 4px;border-radius:12px}
.tabs button.on{background:var(--acc);color:var(--onacc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}
.sheet{position:fixed;inset:0;background:rgba(20,8,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0 4px}
.bars div{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px}
.bl{display:flex;gap:6px}.bl span{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bar2{height:8px;background:var(--acc);border-radius:4px;margin-top:4px}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style></head>
<body>
<h1 id="h"></h1>
<main id="app"></main>
<button class="btn fab" id="fab" data-add="1" aria-label="Новая запись">+</button>
<nav class="tabs"><button data-t="day">Записи</button><button data-t="cl">Клиенты</button><button data-t="sv">Услуги</button><button data-t="inc">Доход</button></nav>
<div class="toast" id="toast"></div><div id="modal"></div>
<script>
function showErr(m){var d=document.createElement("pre");d.style.cssText="white-space:pre-wrap;word-break:break-all;margin:0 0 10px;padding:10px;background:#fde8e8;color:#900;font:12px/1.4 monospace;border-radius:10px";d.textContent="Ошибка: "+m;document.body.insertBefore(d,document.body.firstChild)}
window.addEventListener("error",function(e){showErr((e.message||"")+" (строка "+(e.lineno||"?")+")")});
window.addEventListener("unhandledrejection",function(e){showErr(String(e.reason&&e.reason.message||e.reason))});
</script>
<script>
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
var TODAY=iso(new Date()),WD=["вс","пн","вт","ср","чт","пт","сб"],MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var S={tab:"day",d:TODAY,sv:[],ap:[],q:""};
try{var s=JSON.parse(localStorage.getItem("master")||"null");if(s){S.sv=s.sv;S.ap=s.ap}}catch(e){}
if(!S.sv.length){
 S.sv=[{id:1,n:"Маникюр с покрытием",p:2200,m:120},{id:2,n:"Маникюр классический",p:1400,m:60},{id:3,n:"Наращивание гелем",p:3200,m:150},{id:4,n:"Педикюр",p:2500,m:90}];
 var demo=[["Анна К.","+79001112233",1,-2,"10:00"],["Мария С.","+79004445566",3,-1,"12:00"],["Ольга В.","+79007778899",2,0,"10:00"],["Ирина П.","+79001230000",1,0,"13:00"],["Анна К.","+79001112233",4,1,"11:00"],["Дарья Л.","+79005550011",1,2,"15:00"]];
 demo.forEach(function(x,i){var sv=S.sv[x[2]-1];S.ap.push({id:i+1,c:x[0],ph:x[1],sid:x[2],d:iso(addD(new Date(),x[3])),t:x[4],p:sv.p,st:x[3]<0?"done":"new",note:""})});
}
function save(){try{localStorage.setItem("master",JSON.stringify({sv:S.sv,ap:S.ap}))}catch(e){}}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.className="toast show";setTimeout(function(){e.className="toast"},1800)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sv(id){return S.sv.filter(function(x){return x.id===id})[0]||{n:"Услуга удалена",m:60,p:0}}
function mins(t){var a=t.split(":");return +a[0]*60+ +a[1]}
function hm(m){return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+m%60).slice(-2)}
function rub(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g," ")+" ₽"}
function fmt(d){var x=new Date(d+"T00:00");return x.getDate()+" "+MON[x.getMonth()]+", "+WD[x.getDay()]}
var MONF=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
S.v="week";S.mo=TODAY.slice(0,8)+"01";
function dur(a){var d=a.br?mins(a.e||a.t)-mins(a.t):sv(a.sid).m;return d>0?d:30}
function calHTML(){
 var has={};S.ap.forEach(function(a){if(a.st!=="cancel"&&!a.br)has[a.d]=1});
 var m=new Date(S.mo+"T00:00"),off=(m.getDay()+6)%7,dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),first=addD(m,-off),count=Math.ceil((off+dim)/7)*7;
 var h='<div class="calh"><button class="btn ghost" data-mv="-1">‹</button><b>'+MONF[m.getMonth()]+" "+m.getFullYear()+'</b><button class="btn ghost" data-mv="1">›</button></div><div class="cal">';
 ["пн","вт","ср","чт","пт","сб","вс"].forEach(function(x){h+='<span class="wd">'+x+'</span>'});
 for(var i=0;i<count;i++){var dt=addD(first,i),id=iso(dt);
  h+='<button class="cd'+(id===S.d?' on':'')+(id===TODAY?' td':'')+(dt.getMonth()!==m.getMonth()?' ot':'')+(has[id]?' has':'')+'" data-day="'+id+'">'+dt.getDate()+'<i></i></button>'}
 return h+'</div>';
}
function viewTabs(){return '<div class="vt">'+[["list","Список"],["day","День"],["week","Неделя"],["month","Месяц"]].map(function(v){return '<button data-view="'+v[0]+'" class="'+(S.v===v[0]?'on':'')+'">'+v[1]+'</button>'}).join("")+'</div>'}
function navHTML(){
 var sd=new Date(S.d+"T00:00"),t;
 if(S.v==="week"){var f=addD(sd,-((sd.getDay()+6)%7)),l=addD(f,6);t=f.getDate()+" "+MON[f.getMonth()]+" – "+l.getDate()+" "+MON[l.getMonth()]}else t=fmt(S.d);
 return '<div class="calh"><button class="btn ghost" data-mv="-1">‹</button><b>'+t+'</b><div><button class="btn ghost" data-today="1" style="font-size:13px">Сегодня</button> <button class="btn ghost" data-mv="1">›</button></div></div>';
}
var PH=72;
function gridHTML(){
 var wk=S.v==="week",sd=new Date(S.d+"T00:00"),first=wk?addD(sd,-((sd.getDay()+6)%7)):sd,days=[];
 for(var i=0;i<(wk?7:1);i++)days.push(iso(addD(first,i)));
 var lo=9*60,hi=21*60;
 S.ap.forEach(function(a){if(days.indexOf(a.d)>-1&&a.st!=="cancel"){lo=Math.min(lo,Math.floor(mins(a.t)/60)*60);hi=Math.max(hi,Math.ceil((mins(a.t)+dur(a))/60)*60)}});
 var h='<div class="gh">';
 days.forEach(function(id){var dt=new Date(id+"T00:00");h+='<button class="gd'+(id===TODAY?' td':'')+'" data-dh="'+id+'">'+WD[dt.getDay()]+'<b>'+dt.getDate()+'</b></button>'});
 h+='</div><div class="gb" style="height:'+(hi-lo)/60*PH+'px"><div class="gt">';
 for(var m=lo;m<hi;m+=30)h+='<span class="'+(m%60?'':'h')+'" style="top:'+(m-lo)/60*PH+'px">'+(m%60?':30':m/60)+'</span>';
 h+='</div>';
 days.forEach(function(id){
  h+='<div class="gc" data-col="'+id+'" data-lo="'+lo+'">';
  S.ap.filter(function(a){return a.d===id&&a.st!=="cancel"}).forEach(function(a){
   h+='<button class="gk '+(a.br?'br':a.st)+'" style="top:'+(mins(a.t)-lo)/60*PH+'px;height:'+dur(a)/60*PH+'px" data-open="'+a.id+'"><b>'+esc(a.c)+'</b>'+(a.br?'':'<small>'+esc(sv(a.sid).n)+(wk?'':' · '+a.t)+'</small>')+'</button>'});
  h+='</div>'});
 return h+'</div>';
}
function rowHTML(a){var s=sv(a.sid);return '<button class="ap '+(a.br?'new':a.st)+'" data-open="'+a.id+'"><div class="t">'+a.t+'<small>до '+hm(mins(a.t)+dur(a))+'</small></div><div style="flex:1"><b>'+esc(a.c)+'</b>'+(a.br?'':'<div class="mut">'+esc(s.n)+(a.st==="done"?' · оплачено':'')+'</div>')+'</div>'+(a.br?'':'<b>'+rub(a.p)+'</b>')+'</button>'}
function dayList(d){
 var L=S.ap.filter(function(a){return a.d===d}).sort(function(a,b){return mins(a.t)-mins(b.t)}),act=L.filter(function(a){return a.st!=="cancel"&&!a.br});
 var h='<p class="sum" style="margin-top:12px">'+fmt(d)+': '+(act.length?act.length+' зап. · '+rub(act.reduce(function(s,a){return s+a.p},0)):'свободный день')+'</p>';
 if(!L.length)h+='<div class="empty">Записей нет. Нажмите +</div>';
 return h+L.map(rowHTML).join("");
}
function listHTML(){
 var L=S.ap.filter(function(a){return a.d>=TODAY&&a.st!=="cancel"}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:mins(a.t)-mins(b.t)}),h="",last="";
 if(!L.length)return '<div class="empty">Ближайших записей нет. Нажмите + чтобы добавить.</div>';
 L.forEach(function(a){if(a.d!==last){last=a.d;h+='<div class="dayh">'+(a.d===TODAY?"Сегодня, ":"")+fmt(a.d)+'</div>'}h+=rowHTML(a)});
 return h;
}
function clientSheet(k){
 var L=S.ap.filter(function(a){return !a.br&&(a.ph||a.c)===k}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:mins(b.t)-mins(a.t)});
 if(!L.length)return;
 var dn=L.filter(function(a){return a.st==="done"}),sum=dn.reduce(function(t,a){return t+a.p},0),c=L[0];
 var up=L.filter(function(a){return a.st==="new"&&a.d>=TODAY}).pop(),lv=dn[0];
 var h='<div class="sheet" data-close="1"><div><h2>'+esc(c.c)+'</h2><p class="mut">'+esc(c.ph||"без телефона")+'<br>Визитов: '+dn.length+' · потрачено '+rub(sum)+'<br>Последний визит: '+(lv?fmt(lv.d):"ещё не было")+(up?'<br>Ближайшая запись: '+fmt(up.d)+', '+up.t:'')+'</p>';
 h+='<div class="g2" style="margin-bottom:12px"><button class="btn big" data-recl="'+esc(k)+'">Записать</button>'+(c.ph?'<a class="btn ghost big" style="text-align:center;text-decoration:none;display:block" href="tel:'+esc(c.ph.replace(/[^\d+]/g,""))+'">Позвонить</a>':'<span></span>')+'</div>';
 h+='<p class="sum">История записей</p>';
 L.forEach(function(a){var late=a.st==="new"&&a.d<TODAY,lb=a.st==="done"?"был(а)":a.st==="cancel"?"отменена":late?"не отмечено":"ожидается";
  h+='<button class="ap '+a.st+'" data-open="'+a.id+'"><div class="t" style="width:92px">'+fmt(a.d)+'<small>'+a.t+'</small></div><div style="flex:1">'+esc(sv(a.sid).n)+'<div class="mut">'+lb+'</div></div><b>'+rub(a.p)+'</b></button>'});
 document.getElementById("modal").innerHTML=h+'</div></div>';
}
function backupCard(){return '<div class="card"><b>Резервная копия</b><p class="mut">Перед обновлением приложения нажмите «Скопировать копию» и сохраните текст в Заметки или отправьте себе в Telegram. После установки новой версии вставьте его в поле ниже и нажмите «Восстановить».</p><button class="btn big" data-exp="1">Скопировать копию данных</button><label>Вставьте копию сюда</label><textarea id="rt" rows="3" placeholder="Текст копии" style="min-height:70px"></textarea><div style="height:10px"></div><button class="btn ghost big" data-imp="1">Восстановить из копии</button></div>'}
function manualCopy(j){var ta=document.getElementById("rt");ta.value=j;ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}toast(ok?"Копия скопирована":"Выделите текст в поле и скопируйте вручную")}
function exportData(){var j=JSON.stringify({app:"kabinet-mastera",v:1,sv:S.sv,ap:S.ap});
 try{navigator.clipboard.writeText(j).then(function(){toast("Копия скопирована")},function(){manualCopy(j)})}catch(e){manualCopy(j)}}
function importData(){var v=document.getElementById("rt").value,a=v.indexOf("{"),b=v.lastIndexOf("}");
 if(a<0||b<a){toast("Вставьте копию в поле");return}
 try{var o=JSON.parse(v.slice(a,b+1));if(!Array.isArray(o.sv)||!Array.isArray(o.ap))throw 0;
  if(!confirm("Заменить текущие данные ("+S.ap.length+" записей) данными из копии ("+o.ap.length+" записей)?"))return;
  S.sv=o.sv;S.ap=o.ap;save();render();toast("Данные восстановлены")}catch(e){toast("Копия повреждена или вставлена не полностью")}}
function exitSheet(){document.getElementById("modal").innerHTML='<div class="sheet" data-close="1"><div><h2>Выйти из приложения?</h2><div style="height:12px"></div><div class="g2"><button class="btn ghost big" data-stay="1">Остаться</button><button class="btn big" data-quit="1">Выйти</button></div></div></div>'}
function appPlugin(){return window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.App}
function initBack(){var A=appPlugin();if(!A)return;
 A.addListener("backButton",function(){var m=document.getElementById("modal");
  if(m.innerHTML){m.innerHTML="";return}
  if(S.tab!=="day"){S.tab="day";render();return}
  exitSheet()})}
function render(){
 document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.t===S.tab?"on":""});
 document.getElementById("fab").style.display=S.tab==="day"?"":"none";
 var h="",H="Записи";
 if(S.tab==="day"){
  H="Календарь";h+=viewTabs();
  if(S.v==="list")h+=listHTML();
  else if(S.v==="month")h+=calHTML()+dayList(S.d);
  else h+=navHTML()+gridHTML();
 }else if(S.tab==="cl"){
  H="Клиенты";
  h+='<input id="q" placeholder="Поиск по имени или телефону" value="'+esc(S.q)+'" style="margin-bottom:10px">';
  var C={};S.ap.forEach(function(a){if(a.br)return;var c=C[a.ph||a.c]||(C[a.ph||a.c]={k:a.ph||a.c,n:a.c,ph:a.ph,v:0,sum:0,last:""});if(a.st==="done"){c.v++;c.sum+=a.p}if(a.st!=="cancel"&&a.d>c.last)c.last=a.d});
  var q=S.q.toLowerCase(),arr=Object.keys(C).map(function(k){return C[k]}).filter(function(c){return !q||(c.n+c.ph).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.sum-a.sum});
  if(!arr.length)h+='<div class="empty">Клиентов пока нет. Они появятся из записей.</div>';
  arr.forEach(function(c){h+='<button class="card cb" data-cl="'+esc(c.k)+'"><div class="row"><b>'+esc(c.n)+'</b><span>'+rub(c.sum)+'</span></div><div class="mut">'+esc(c.ph||"без телефона")+' · визитов: '+c.v+(c.last?' · последняя запись '+fmt(c.last):'')+'</div></button>'});
 }else if(S.tab==="sv"){
  H="Услуги";
  S.sv.forEach(function(x){h+='<div class="card"><div class="row"><b>'+esc(x.n)+'</b><button class="btn ghost" data-delsv="'+x.id+'">Удалить</button></div><div class="mut">'+rub(x.p)+' · '+x.m+' мин</div></div>'});
  h+='<div class="card"><b>Новая услуга</b><label>Название</label><input id="sn"><div class="g2"><div><label>Цена, ₽</label><input id="sp" type="number" inputmode="numeric"></div><div><label>Длительность, мин</label><input id="sm" type="number" inputmode="numeric" value="60"></div></div><div style="height:12px"></div><button class="btn big" id="addsv">Добавить услугу</button></div>';h+=backupCard();
 }else{
  H="Доход";
  var ym=TODAY.slice(0,7),dn=S.ap.filter(function(a){return a.st==="done"&&a.d.slice(0,7)===ym}),tot=dn.reduce(function(s,a){return s+a.p},0);
  var fut=S.ap.filter(function(a){return a.st==="new"&&a.d>=TODAY}).reduce(function(s,a){return s+a.p},0);
  h+='<div class="g2"><div class="stat"><span class="mut">За месяц</span><b>'+rub(tot)+'</b></div><div class="stat"><span class="mut">Средний чек</span><b>'+(dn.length?rub(tot/dn.length):"—")+'</b></div><div class="stat"><span class="mut">Визитов</span><b>'+dn.length+'</b></div><div class="stat"><span class="mut">Ожидается</span><b>'+rub(fut)+'</b></div></div>';
  var w=[];for(var k=6;k>=0;k--){var id=iso(addD(new Date(),-k));w.push([WD[new Date(id+"T00:00").getDay()],S.ap.filter(function(a){return a.d===id&&a.st==="done"}).reduce(function(s,a){return s+a.p},0)])}
  var mx=Math.max.apply(null,w.map(function(x){return x[1]}).concat([1]));
  h+='<p class="sum" style="margin-top:16px">Последние 7 дней</p><div class="bars">'+w.map(function(x){return '<div style="height:'+(x[1]/mx*100)+'%"></div>'}).join("")+'</div><div class="bl">'+w.map(function(x){return '<span>'+x[0]+'</span>'}).join("")+'</div>';
  h+='<p class="sum" style="margin-top:16px">По услугам за месяц</p>';
  S.sv.forEach(function(x){var s=dn.filter(function(a){return a.sid===x.id}).reduce(function(t,a){return t+a.p},0);if(s)h+='<div class="card"><div class="row"><span>'+esc(x.n)+'</span><b>'+rub(s)+'</b></div><div class="bar2" style="width:'+(s/tot*100)+'%"></div></div>'});
  if(!tot)h+='<div class="empty">Доход появится, когда вы отметите визиты как выполненные.</div>';
 }
 document.getElementById("h").textContent=H;document.getElementById("app").innerHTML=h;
 var qi=document.getElementById("q");
 if(qi)qi.oninput=function(){S.q=qi.value;var p=qi.selectionStart;render();var n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)};
}
function close(){document.getElementById("modal").innerHTML=""}
function addSheet(dd,tt){dd=dd||S.d;tt=tt||"12:00";
 var h='<div class="sheet" data-close="1"><div><h2>Новая запись</h2><label>Тип</label><select id="ctp"><option value="a">Запись клиента</option><option value="b">Перерыв / занято</option></select><label>Клиент</label><input id="cn" placeholder="Имя"><label>Телефон</label><input id="cp" type="tel" inputmode="tel" placeholder="+7 900 000-00-00">'+
 '<label>Услуга</label><select id="cs">'+S.sv.map(function(x){return '<option value="'+x.id+'">'+esc(x.n)+' — '+rub(x.p)+'</option>'}).join("")+'</select>'+
 '<div class="g2"><div><label>Дата</label><input id="cd" type="date" value="'+dd+'"></div><div><label>Время</label><input id="ct" type="time" value="'+tt+'" step="900"></div></div>'+
 '<label>Конец (только для перерыва)</label><input id="ce" type="time" value="'+hm(Math.min(mins(tt)+60,1439))+'" step="900"><label>Заметка</label><input id="cm" placeholder="Например: снять старое покрытие"><div style="height:16px"></div><button class="btn big" id="saveap">Сохранить запись</button></div></div>';
 document.getElementById("modal").innerHTML=h;
}
function openSheet(id){
 var a=S.ap.filter(function(x){return x.id===id})[0],s=sv(a.sid);
 var h='<div class="sheet" data-close="1"><div><h2>'+esc(a.c)+'</h2><p class="mut">'+(a.br?"":esc(a.ph||"без телефона")+"<br>")+fmt(a.d)+', '+a.t+'–'+hm(mins(a.t)+dur(a))+(a.br?'':' · '+esc(s.n)+' · '+rub(a.p))+(a.note?'<br>'+esc(a.note):'')+'</p>'+
 (a.st==="new"&&!a.br?'<button class="btn big" data-done="'+id+'">Клиент пришёл — оплачено</button><div style="height:8px"></div>':'')+
 (a.br?'':'<button class="btn ghost big" data-rem="'+id+'">Скопировать напоминание клиенту</button><div style="height:8px"></div>')+
 (a.st==="new"?'<button class="btn bad big" data-cx="'+id+'">Отменить запись</button><div style="height:8px"></div>':'')+
 '<button class="btn bad big" data-del="'+id+'">Удалить</button></div></div>';
 document.getElementById("modal").innerHTML=h;
}
function copy(t){try{navigator.clipboard.writeText(t).then(function(){toast("Скопировано")},function(){prompt("Скопируйте текст",t)})}catch(e){prompt("Скопируйте текст",t)}}
document.addEventListener("click",function(e){

 var gc=e.target.closest&&e.target.closest(".gc");
 if(gc&&!e.target.closest("button")){var y=e.clientY-gc.getBoundingClientRect().top;addSheet(gc.dataset.col,hm(Math.min(+gc.dataset.lo+Math.floor(y/(PH/2))*30,1410)));return}
 var t=e.target.closest("button,.sheet"),d=t?t.dataset:{};if(!t)return;
 if(d.mv){var n=+d.mv;if(S.v==="month"){var m=new Date(S.mo+"T00:00");S.mo=iso(new Date(m.getFullYear(),m.getMonth()+n,1))}else{S.d=iso(addD(new Date(S.d+"T00:00"),n*(S.v==="week"?7:1)));S.mo=S.d.slice(0,8)+"01"}render()}
 else if(d.today){S.d=TODAY;S.mo=TODAY.slice(0,8)+"01";render()}
 else if(d.view){S.v=d.view;S.mo=S.d.slice(0,8)+"01";render()}
 else if(d.cl){clientSheet(d.cl)}
 else if(d.recl){var q=S.ap.filter(function(a){return !a.br&&(a.ph||a.c)===d.recl})[0];addSheet();document.getElementById("cn").value=q.c;document.getElementById("cp").value=q.ph||""}
 else if(d.exp){exportData()}
 else if(d.imp){importData()}
 else if(d.stay){close()}
 else if(d.quit){var A=appPlugin();if(A)A.exitApp()}
 else if(d.dh){S.d=d.dh;S.v="day";render()}
 else if(d.t){S.tab=d.t;render()}
 else if(d.day){S.d=d.day;S.mo=d.day.slice(0,8)+"01";render()}
 else if(d.add){addSheet()}
 else if(d.open){openSheet(+d.open)}
 else if(d.done){S.ap.forEach(function(a){if(a.id===+d.done)a.st="done"});save();close();render();toast("Визит записан в доход")}
 else if(d.cx){S.ap.forEach(function(a){if(a.id===+d.cx)a.st="cancel"});save();close();render();toast("Запись отменена")}
 else if(d.del){S.ap=S.ap.filter(function(a){return a.id!==+d.del});save();close();render()}
 else if(d.rem){var a=S.ap.filter(function(x){return x.id===+d.rem})[0];copy("Здравствуйте, "+a.c+"! Напоминаю о записи: "+fmt(a.d)+" в "+a.t+" ("+sv(a.sid).n+"). Если планы изменятся, напишите заранее.")}
 else if(d.delsv){S.sv=S.sv.filter(function(x){return x.id!==+d.delsv});save();render()}
 else if(t.id==="addsv"){var n=document.getElementById("sn").value.trim(),p=+document.getElementById("sp").value,m=+document.getElementById("sm").value;
  if(!n||!p||!m){toast("Заполните название, цену и время");return}
  S.sv.push({id:Date.now(),n:n,p:p,m:m});save();render();toast("Услуга добавлена")}
 else if(t.id==="saveap"){
  var br=document.getElementById("ctp").value==="b",c=document.getElementById("cn").value.trim(),sid=+document.getElementById("cs").value,dd=document.getElementById("cd").value,tt=document.getElementById("ct").value,ee=document.getElementById("ce").value,nt=document.getElementById("cm").value.trim();
  if(!dd||!tt||(!br&&!c)){toast(br?"Укажите дату и время":"Укажите клиента, дату и время");return}
  if(br&&(!ee||mins(ee)<=mins(tt))){toast("Укажите время окончания перерыва");return}
  var x=sv(sid),st=mins(tt),en=br?mins(ee):st+x.m;
  var clash=S.ap.filter(function(a){return a.d===dd&&a.st!=="cancel"&&mins(a.t)<en&&mins(a.t)+dur(a)>st})[0];
  if(clash&&!confirm("Время пересекается: "+clash.c+" в "+clash.t+". Всё равно сохранить?"))return;
  S.ap.push(br?{id:Date.now(),c:"Перерыв",ph:"",sid:0,d:dd,t:tt,e:ee,p:0,st:"new",br:1,note:nt}:{id:Date.now(),c:c,ph:cleanPh(document.getElementById("cp").value),sid:sid,d:dd,t:tt,p:x.p,st:"new",note:nt});
  save();S.d=dd;S.mo=dd.slice(0,8)+"01";S.tab="day";close();render();toast(br?"Перерыв добавлен":"Запись добавлена")}
 else if(d.close&&e.target===t){close()}
});
function fmtPh(v){var d=v.replace(/\D/g,"");if(d[0]==="7"||d[0]==="8")d=d.slice(1);d=d.slice(0,10);
 var r="+7";if(d.length)r+=" "+d.slice(0,3);if(d.length>3)r+=" "+d.slice(3,6);if(d.length>6)r+="-"+d.slice(6,8);if(d.length>8)r+="-"+d.slice(8,10);return r}
function cleanPh(v){return v.replace(/\D/g,"").length>1?v.trim():""}
document.addEventListener("focusin",function(e){var el=e.target;if(el.id==="cp"&&!el.value){el.value="+7 ";setTimeout(function(){try{el.setSelectionRange(3,3)}catch(x){}},0)}});
document.addEventListener("input",function(e){var el=e.target;if(el.id==="cp")el.value=fmtPh(el.value)});
document.addEventListener("focusout",function(e){var el=e.target;if(el.id==="cp"&&el.value.replace(/\D/g,"").length<2)el.value=""});
var TABS=["day","cl","sv","inc"],SW={x:0,y:0,t:0,ok:false};
document.addEventListener("touchstart",function(e){var t=e.touches[0];SW.x=t.clientX;SW.y=t.clientY;SW.t=Date.now();
 SW.ok=e.touches.length===1&&t.clientX>28&&t.clientX<window.innerWidth-28&&!document.getElementById("modal").innerHTML&&!(e.target.closest&&e.target.closest("input,textarea,select"))},{passive:true});
document.addEventListener("touchend",function(e){if(!SW.ok)return;SW.ok=false;var t=e.changedTouches[0],dx=t.clientX-SW.x,dy=t.clientY-SW.y;
 if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-SW.t>700)return;
 var i=TABS.indexOf(S.tab)+(dx<0?1:-1);if(i<0||i>=TABS.length)return;
 S.tab=TABS[i];render();window.scrollTo(0,0);var a=document.getElementById("app");a.classList.remove("sl","sr");void a.offsetWidth;a.classList.add(dx<0?"sl":"sr")},{passive:true});
render();initBack();
</script></body></html>
