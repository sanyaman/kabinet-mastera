name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret DEBUG_KEYSTORE_B64 is missing"; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep SHA256
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
      - name: Verify APK signature
        run: |
          A=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256 | tr -d ' \t')
          K=$(keytool -list -v -keystore $HOME/.android/debug.keystore -storepass android | grep SHA256 | tr -d ' \t')
          echo "APK: $A"
          echo "KEY: $K"
          if [ "${A##*SHA256:}" != "${K##*SHA256:}" ]; then echo "::error::APK signed with a different key"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-mastera-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
